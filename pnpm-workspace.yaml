packages:
  - packages/*

allowBuilds:
  esbuild: true

overrides:
  esbuild: 0.28.2
  '@typescript-eslint/tsconfig-utils': 8.73.0
  '@typescript-eslint/types': 8.73.0
  eslint: 10.15.0
  typescript-eslint: 8.73.0
  # eslint 10 / @stryker-mutator 10.1.1 declare minimatch ^10.2.4, but 10.x is
  # affected by GHSA-g3hv-75wg-m249 (globparts DoS, patched >=11.0.1);
  # force the patched 11.0.9 so `pnpm audit --audit-level=moderate` passes.
  minimatch: 11.0.9
  # @stryker-mutator 10.1.1 pulls qs 6.15.1 via typed-rest-client;
  # force the patched 6.17.1 so `pnpm audit --audit-level=moderate` passes.
  qs: 6.17.1
