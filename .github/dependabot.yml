version: 2

# Scheduled version updates are disabled (limit 0): bumps are handled by a
# monthly manual rollup PR instead of per-dependency bot PRs, because pnpm
# overrides, packed-consumer pins, and fixture compatibility need a single
# human-verified update. This limit does not affect Dependabot security
# updates (repo setting), which should stay enabled for CVE coverage.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      types:
        patterns:
          - "@types/*"
      eslint:
        patterns:
          - "eslint*"
          - "typescript-eslint*"
          - "@eslint/*"
          - "eslint-plugin-*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      tsup:
        patterns:
          - "tsup"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: pip
    directory: "/packages/tests/python"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
