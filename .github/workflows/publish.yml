# Manual fallback for re-publishing a tagged release without changesets/action.
# Primary path is .github/workflows/release.yml which fires on push to main.
name: Publish (manual fallback)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to publish from"
        required: true
        default: "main"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned PAdES validation tools
        run: pnpm --filter pdf-rfc3161-tests run install:pades-oracles

      - name: Verify pinned PAdES validation-tool versions
        run: pnpm --filter pdf-rfc3161-tests run assert:pades-oracles

      - name: Install pyHanko
        run: uv pip install --system --require-hashes -r packages/tests/python/requirements.lock

      - name: Build
        run: pnpm -r build

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Offline PAdES interoperability checks
        run: pnpm --filter pdf-rfc3161-tests test:interoperability

      - name: Packed consumer test
        run: pnpm --filter pdf-rfc3161-tests test:package

      - name: Publish
        run: pnpm -r publish --provenance --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
