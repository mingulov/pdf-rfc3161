name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version PR or Publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'

      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.12.5'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned PAdES validation tools
        run: pnpm --filter pdf-rfc3161-tests run install:pades-oracles

      - name: Verify pinned PAdES validation-tool versions
        run: pnpm --filter pdf-rfc3161-tests run assert:pades-oracles

      - name: Install pyHanko
        run: uv pip install --system --require-hashes -r packages/tests/python/requirements.lock

      - name: Build
        run: pnpm -r build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Offline PAdES interoperability checks
        run: pnpm --filter pdf-rfc3161-tests test:interoperability

      - name: Packed consumer test
        run: pnpm --filter pdf-rfc3161-tests test:package

      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm -r publish --provenance --no-git-checks --access public
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
