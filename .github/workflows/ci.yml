name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify packed consumer
        if: matrix.node == '24'
        run: pnpm --filter pdf-rfc3161-tests test:package

      - name: Type check
        run: pnpm typecheck

      - name: Install ghostscript (strict PDF oracle)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript

      - name: Run tests
        run: pnpm test

      - name: Run tests with coverage
        if: matrix.node == '24'
        run: pnpm --filter pdf-rfc3161-tests run test:coverage

      - name: Upload coverage
        if: matrix.node == '24'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./packages/tests/coverage/lcov.info
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

  pades-conformance:
    name: Offline PAdES Interoperability
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned PAdES validation tools
        run: pnpm --filter pdf-rfc3161-tests run install:pades-oracles

      - name: Verify pinned PAdES validation-tool versions
        run: pnpm --filter pdf-rfc3161-tests run assert:pades-oracles

      - name: Install pyHanko
        run: uv pip install --system --require-hashes -r packages/tests/python/requirements.lock

      - name: Build
        run: pnpm build

      - name: Run offline PAdES interoperability checks
        run: pnpm --filter pdf-rfc3161-tests test:interoperability

  native-pdf-compatibility:
    name: Native PDF compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native PDF readers
        run: pnpm --filter pdf-rfc3161-tests exec vitest run test/unit/native-pdf-compatibility.test.ts

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    # Only run on main branch to avoid rate limiting from TSAs
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run integration tests
        run: pnpm --filter pdf-rfc3161-tests run test:integration
        env:
          NODE_ENV: test
          LIVE_TSA_TESTS: 'true'
