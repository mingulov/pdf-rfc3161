name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify packed consumer
        if: matrix.node == '24'
        run: pnpm --filter pdf-rfc3161-tests test:package

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run tests with coverage
        if: matrix.node == '24'
        run: pnpm --filter pdf-rfc3161-tests run test:coverage

      - name: Upload coverage
        if: matrix.node == '24'
        uses: codecov/codecov-action@v6
        with:
          files: ./packages/tests/coverage/lcov.info
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

  pades-conformance:
    name: Offline PAdES Conformance
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@v9
        with:
          version: '0.12.5'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned PAdES oracles
        run: pnpm --filter pdf-rfc3161-tests run install:pades-oracles

      - name: Verify pinned PAdES oracle versions
        run: pnpm --filter pdf-rfc3161-tests run assert:pades-oracles

      - name: Install pyHanko
        run: uv pip install --system --require-hashes -r packages/tests/python/requirements.lock

      - name: Build
        run: pnpm build

      - name: Run offline PAdES conformance
        run: pnpm --filter pdf-rfc3161-tests test:conformance

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    # Only run on main branch to avoid rate limiting from TSAs
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run integration tests
        run: pnpm --filter pdf-rfc3161-tests run test:integration
        env:
          NODE_ENV: test
          LIVE_TSA_TESTS: 'true'
