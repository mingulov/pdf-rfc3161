name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify packed consumer
        if: matrix.node == '24'
        run: pnpm --filter pdf-rfc3161-tests test:package

      - name: Install Playwright Chromium (browser signing gate)
        if: matrix.node == '24'
        run: pnpm --filter pdf-rfc3161-tests exec playwright install --with-deps chromium

      - name: Verify browser signing gate
        if: matrix.node == '24'
        timeout-minutes: 15
        run: pnpm --filter pdf-rfc3161-tests test:browser:package

      - name: Type check
        run: pnpm typecheck

      - name: Install ghostscript (strict PDF oracle)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript

      - name: Run tests
        run: pnpm test

      - name: Run tests with coverage
        if: matrix.node == '24'
        run: pnpm --filter pdf-rfc3161-tests run test:coverage

      - name: Upload coverage
        if: matrix.node == '24'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./packages/tests/coverage/lcov.info
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Verify lint made no changes
        # The per-package lint scripts run eslint --fix and exit 0 even
        # when they rewrote files, so a tree whose committed sources
        # violate lint would otherwise pass. Fail on any drift (T13).
        run: git diff --exit-code

  package-gates:
    name: Package inspection gates
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Fixed-version jobs pin 26; only the test matrix uses 24
          # (supply-chain-policy.test.ts forbids 24 outside the matrix;
          # fixed jobs pin 26 by convention).
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack exactly one candidate tarball per public package
        # T13: one pack feeds attw, publint and the packed consumer on
        # identical bytes. Fail on zero/multiple tarballs per directory.
        run: |
          rm -rf /tmp/t13-candidates /tmp/t13-receipts
          mkdir -p /tmp/t13-candidates/core /tmp/t13-candidates/cli /tmp/t13-receipts
          pnpm --filter pdf-rfc3161 pack --pack-destination /tmp/t13-candidates/core
          pnpm --filter pdf-rfc3161-cli pack --pack-destination /tmp/t13-candidates/cli
          CORE_COUNT=$(ls /tmp/t13-candidates/core/*.tgz | wc -l)
          CLI_COUNT=$(ls /tmp/t13-candidates/cli/*.tgz | wc -l)
          [ "$CORE_COUNT" = "1" ] || { echo "expected one core tarball, found $CORE_COUNT"; exit 1; }
          [ "$CLI_COUNT" = "1" ] || { echo "expected one CLI tarball, found $CLI_COUNT"; exit 1; }
          echo "CORE_TARBALL=$(ls /tmp/t13-candidates/core/*.tgz)" >> "$GITHUB_ENV"
          echo "CLI_TARBALL=$(ls /tmp/t13-candidates/cli/*.tgz)" >> "$GITHUB_ENV"
          sha256sum /tmp/t13-candidates/core/*.tgz /tmp/t13-candidates/cli/*.tgz

      - name: Check core types with attw (node16 profile)
        # attw reads the tarball directly; never attw --pack here (it
        # invokes npm pack, and this is a pnpm workspace). Obsolete
        # node10 resolution is ignored by the profile; modern ESM/CJS
        # and bundler checks must pass.
        run: pnpm --filter pdf-rfc3161-tests exec attw "$CORE_TARBALL" --profile node16

      - name: Lint both tarballs with publint --strict
        run: |
          pnpm --filter pdf-rfc3161-tests exec publint "$CORE_TARBALL" --strict
          pnpm --filter pdf-rfc3161-tests exec publint "$CLI_TARBALL" --strict

      - name: Verify packed consumer on the same tarballs
        run: pnpm --filter pdf-rfc3161-tests test:package -- "$CORE_TARBALL" "$CLI_TARBALL" --receipt /tmp/t13-receipts/packed-consumer.json

      - name: Upload package-gate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-gate-receipts
          path: /tmp/t13-receipts/
          if-no-files-found: warn

  pades-conformance:
    name: Offline PAdES Interoperability
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.10'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned PAdES validation tools
        run: pnpm --filter pdf-rfc3161-tests run install:pades-oracles

      - name: Verify pinned PAdES validation-tool versions
        run: pnpm --filter pdf-rfc3161-tests run assert:pades-oracles

      - name: Install pyHanko
        run: uv pip install --system --require-hashes -r packages/tests/python/requirements.lock

      - name: Build
        run: pnpm build

      - name: Run offline PAdES interoperability checks
        run: pnpm --filter pdf-rfc3161-tests test:interoperability -- --output-dir /tmp/pades-conformance

      - name: Upload PAdES conformance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pades-conformance-artifacts
          path: /tmp/pades-conformance/
          if-no-files-found: error

  native-pdf-compatibility:
    name: Native PDF compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, windows-2025]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test native PDF readers
        run: pnpm --filter pdf-rfc3161-tests exec vitest run test/unit/native-pdf-compatibility.test.ts

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    # Only run on main branch to avoid rate limiting from TSAs
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run integration tests
        run: pnpm --filter pdf-rfc3161-tests run test:integration
        env:
          NODE_ENV: test
          LIVE_TSA_TESTS: 'true'

  browser-matrix:
    name: Cross-browser signing matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers (chromium, firefox, webkit)
        # One install covers both the signing gate and demo E2E: both
        # packages resolve the same Playwright and share the browser cache.
        run: pnpm --filter pdf-rfc3161-tests exec playwright install --with-deps chromium firefox webkit

      - name: Run browser signing gate on all engines
        timeout-minutes: 25
        run: pnpm --filter pdf-rfc3161-tests test:browser:package -- --engine all --receipt /tmp/browser-matrix-receipt.json --trace-dir /tmp/browser-matrix-traces --pdf-export-dir /tmp/browser-matrix-pdfs

      - name: Run deterministic demo E2E on all engines
        # Only the offline specs: automatic-flow, timestamp-manual and
        # ltv-timestamp still drive public TSAs and stay local-only until
        # a later task makes them deterministic.
        timeout-minutes: 15
        run: pnpm --filter pdf-rfc3161-demo exec playwright test manual-flow timestamp-direct validator --reporter=list

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-matrix-receipt
          path: /tmp/browser-matrix-receipt.json
          if-no-files-found: warn

      - name: Upload signing-gate failure traces
        # The standalone gate runner saves one trace zip per failed
        # engine (trace-<engine>.zip, save-on-failure only); the demo
        # step below is skipped when the gate fails, so this directory
        # is the only trace evidence for signing-gate failures.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-gate-traces
          path: /tmp/browser-matrix-traces/
          if-no-files-found: warn

      # Native-reader handoff (gate side; T10 owns consumption). The
      # browser-matrix-pdfs artifact carries the exact candidate-produced
      # PDFs for native qualification: one <engine>-<case>.pdf per gate
      # case (10 cases x chromium/firefox/webkit) plus manifest.json.
      # Manifest format (JSON): { gate: "T18", hashAlgorithm: "SHA-256",
      # candidate: { tarballSha256, distSha256, version }, files: [{
      # engine, case, file, sha256, bytes }] }. The T10 native job
      # should download this artifact, verify every file against its
      # SHA-256 manifest entry, feed the PDFs to the native readers,
      # and retain their results alongside the gate receipt.
      - name: Upload candidate PDFs for native readers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-matrix-pdfs
          path: /tmp/browser-matrix-pdfs/
          if-no-files-found: warn

      - name: Upload demo E2E failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-e2e-traces
          path: packages/demo/test-results/
          if-no-files-found: warn
