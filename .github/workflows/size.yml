name: Bundle size

on:
  pull_request:
    paths:
      - "packages/core/src/**"
      - "packages/core/tsup.config.ts"
      - "packages/core/package.json"
      - ".github/workflows/size.yml"

permissions:
  contents: read

jobs:
  size:
    name: Measure bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter pdf-rfc3161 build

      - name: Report bundle sizes
        run: |
          for f in packages/core/dist/index.js packages/core/dist/index.cjs packages/core/dist/index.d.ts packages/core/dist/advanced.js packages/core/dist/rfcs/rfc5544.js packages/core/dist/rfcs/rfc8933.js; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              printf '%-50s %10d bytes\n' "$f" "$SIZE"
            fi
          done

      # Main ESM entry-point budget; update deliberately when public exports grow.
      # R13 (T02 fix round 2): 235 KiB. The T02 transport hardening
      # (streaming bounded reader, error classification, abort/deadline
      # machinery) is mandated security behavior that grew the main entry
      # point past 225 KiB; compaction inside T02's files would gut
      # requirements. Revisit in program task T19; further breaches get
      # per-breach rulings.
      # R16 (T09a): 236 KiB. The T09a mandatory pre-embed signer-validity
      # gate (R15) grew the main entry past 235 KiB; bundle-diff verified
      # the +414 bytes are gate + hardening + message only (pki-utils was
      # already bundled, zero new module code), and even a gate-alone
      # minimal change exceeds the old headroom. Per-breach ruling with
      # independent reviewer verification; T19 still owns bundle efficiency.
      # R17 (T05): 237 KiB. The T05 exact byte-identity skip/seen-set
      # (CB3/R27) and AIA issuance gate (CB4) grew the main entry past
      # 236 KiB by +560 bytes; realistic compaction without gutting
      # mandated behavior is ~25-55 bytes (diagnostic string trimming
      # only). Per-breach ruling with independent reviewer verification;
      # T19 still owns bundle efficiency.
      # R18 (T08): 249 KiB. The T08 aggregate OperationBudget tracker and
      # its LTV/session/fetch/breaker threading grew the main entry by
      # +11602 bytes (242563 -> 254165); the budget must live on the
      # main signing path, so unlike T06/T07 it cannot be tree-shaken
      # into advanced-only. Bundle-diff verified the growth is the new
      # module plus call-site threading (no duplicated modules, no
      # accidental heavy imports); realistic compaction is ~2 KiB at
      # most, an order of magnitude short. Per-breach ruling;
      # T19 still owns bundle efficiency.
      # R20 (T09b): 251 KiB. The T09b historical chain validation
      # (verifyChainAtTime capability + chainValidationTime dispatch +
      # finite-date/full-consumption gates) grew the main entry by
      # +1877 bytes (254924 -> 256801). Bundle-diff verified exactly
      # 4 hunks (extract dispatch, delegation, gates, checkDate
      # param), no new modules, no duplication; the OCSP/CRL
      # revocation-date work is advanced-only (main unmoved).
      # Realistic compaction (~400 bytes: failure-return dedupe +
      # comment trimming) is an order of magnitude short. Per-breach
      # ruling; T19 still owns bundle efficiency.
      # R21 (T09b fix round 2): 252 KiB. The Astra P2 fixes (F1 date
      # snapshot helper + 2 call sites, F2 INVALID_ARGUMENT escape,
      # F3 code copy, F4 doc corrections) grew the main entry by
      # +536 bytes (256801 -> 257337). Bundle-diff verified 31
      # changed lines, all mandated review findings (plus a tiny
      # date.ts helper); the Feb-30 stretch is advanced-only (main
      # unmoved). Compaction already applied by the fixer (shared
      # helper, inlined construction, minimal JSDoc); further savings
      # under 100 bytes. Per-breach ruling; T19 still owns bundle
      # efficiency.
      # R22 (T09b fix round 5): 253 KiB. The Astra N2/N3 fixes
      # (defineProperty overrides + eager original-receiver policy
      # reads in withOwn) grew the main entry by +580 bytes
      # (258032 -> 258612). Bundle-diff verified a single withOwn
      # hunk (field table + defineProperty/eager logic), no new
      # modules, no duplication. Fixer compacted 258739 -> 258612
      # first; the remainder is irreducible mandated runtime.
      # Per-breach ruling; T19 still owns bundle efficiency.
      # R23 (T11): 255 KiB. The T11 parser/request contracts (R9 stable
      # TimeStampedData schema rejection, R10 AIA shape guards, R11 ESS
      # lookup, R19 digest-length + TSTInfo profile checks, T03-F8
      # figure, 0x18 normalization at 3 choke points) grew the main
      # entry by +2051 bytes (258442 -> 260493). 254 KiB (260096) is
      # insufficient, so 255 KiB (261120, headroom 627) is the minimal
      # integer-KiB fit. BASE rebuilt byte-identical; no new modules
      # or imports (167 added / 31 removed core lines); new messages
      # single-copy. Compaction applied throughout (terse messages,
      # shared helpers); realistic remainder under 200 bytes, an order
      # of magnitude short. Per-breach ruling; T19 still owns bundle
      # efficiency.
      # R24 (T12): 257 KiB. The T12 diagnostics/CLI contracts
      # (verificationErrorCode on every failure path, session
      # getLTVErrors, one-call/archive ltvErrors, completed cause
      # sanitizer + diagnostic-URL audit, plain-HTTP warning with
      # loopback exemption) grew the main entry by +2391 bytes
      # (260619 -> 263010). 256 KiB (262144) is insufficient, so
      # 257 KiB (263168, headroom 158) is the minimal integer-KiB
      # fit. BASE rebuilt byte-identical; no new modules or imports
      # (240 added / 94 removed lines); per-commit attribution
      # +292/+197/+309/+0/+995/+133/+465. Compaction attempted on
      # the one-call wiring with no material effect; the breach is
      # structural mandated runtime. Per-breach ruling; T19 still
      # owns bundle efficiency.
      # R25 (T12 fix round 2): 258 KiB. The sol P1/P2 fixes (uncapped
      # quoted-value + tail consumption in the transport sanitizer,
      # parsed-protocol plain-HTTP detection) grew the main entry by
      # +181 bytes (263107 -> 263288). 257 KiB (263168) is exceeded
      # by 120, so 258 KiB (264192, headroom 904) is the minimal
      # integer-KiB fit. Per-commit attribution +59/+122, both hunks
      # code-only; compaction applied (end++), further golf rejected
      # as immaterial vs a 120-byte breach; no new modules. The
      # headroom jump is an artifact of integer-KiB granularity, not
      # slack. Per-breach ruling; T19 still owns bundle efficiency.
      - name: Enforce ESM bundle size budget (<= 258 KiB)
        run: |
          SIZE=$(stat -c%s packages/core/dist/index.js)
          MAX=264192
          echo "ESM main bundle: $SIZE bytes (maximum: $MAX bytes / 258 KiB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::ESM bundle exceeds 258 KiB (264192 bytes) budget"
            exit 1
          fi
