name: Bundle size

on:
  pull_request:
    paths:
      - "packages/core/src/**"
      - "packages/core/tsup.config.ts"
      - "packages/core/package.json"
      - ".github/workflows/size.yml"

permissions:
  contents: read

jobs:
  size:
    name: Measure bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter pdf-rfc3161 build

      - name: Report bundle sizes
        run: |
          for f in packages/core/dist/index.js packages/core/dist/index.cjs packages/core/dist/index.d.ts packages/core/dist/advanced.js packages/core/dist/rfcs/rfc5544.js packages/core/dist/rfcs/rfc8933.js; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              printf '%-50s %10d bytes\n' "$f" "$SIZE"
            fi
          done

      # Main ESM entry-point budget. October 2026 CMS algorithm/parameter
      # validation and PDF metadata encoding increase raw size 263983 ->
      # 267933 bytes (+3950); gzip level 9 is 57931 -> 58734 (+803).
      # Keep a hard 262 KiB ceiling; see docs/maintenance-audit-2026-10.md.
      # Raise only deliberately with measured bundle-diff attribution.
      - name: Enforce ESM bundle size budget (<= 262 KiB)
        run: |
          SIZE=$(stat -c%s packages/core/dist/index.js)
          MAX=268288
          echo "ESM main bundle: $SIZE bytes (maximum: $MAX bytes / 262 KiB)"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::ESM bundle exceeds 262 KiB (268288 bytes) budget"
            exit 1
          fi
